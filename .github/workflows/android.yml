# Construiește aplicația Android (APK) la fiecare push și când apeși „Run workflow”.
# APK-ul apare la Actions → ultima rulare → Artifacts → MasaDePoker-APK.
name: Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Construiește APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Redenumește
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MasaDePoker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MasaDePoker-APK
          path: MasaDePoker.apk

      - name: Publică APK-ul (release „masa-de-poker”)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete masa-de-poker --yes --cleanup-tag || true
          gh release create masa-de-poker MasaDePoker.apk --target "$GITHUB_SHA" --title "Masa de Poker + Jarvis (Android)" --notes "Build automat din commit ${GITHUB_SHA::7}" --latest=false
